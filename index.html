<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlackRun - Experimental</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      position: relative;
    }

    #game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 28px;
      letter-spacing: 4px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .badge {
      font-size: 10px;
      background: #000;
      color: #fff;
      padding: 2px 6px;
      vertical-align: middle;
      letter-spacing: 1px;
    }

    .scoreboard {
      font-size: 16px;
      font-weight: bold;
      margin-top: 10px;
      letter-spacing: 2px;
    }

    canvas {
      background-color: #ffffff;
      display: block;
      cursor: pointer;
    }

    /* Modo Noite para o Canvas e Página */
body.tema-noite canvas {
    background-color: #1a1a2e;
}

body.tema-noite {
    background-color: #121212;
    color: #fff;
}

    .controls-hint {
      margin-top: 15px;
      font-size: 12px;
      color: #333333;
      text-align: center;
    }

    footer {
      position: absolute;
      bottom: 20px;
      right: 30px;
      font-size: 12px;
      color: #000000;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <header>
      <h1>BlackRun <span class="badge">EXPERIMENTAL</span></h1>
      <div class="scoreboard">
        PONTOS: <span id="score">0</span> &nbsp;&nbsp; RECORDES: <span id="highscore">0</span>
      </div>
    </header>

    <canvas id="gameCanvas" width="800" height="200"></canvas>

    <div class="controls-hint">
      Pressione <strong>ESPAÇO</strong> ou <strong>CLIQUE NA TELA</strong> para saltar.
    </div>
  </div>

  <footer>
    Produção: Jefferson Gilvan Gomes dos Santos
  </footer>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const scoreElement = document.getElementById('score');
    const highscoreElement = document.getElementById('highscore');

    let isGameRunning = false;
    let isGameOver = false;
    let score = 0;
    let highScore = localStorage.getItem('blackrun_highscore') || 0;
    highscoreElement.textContent = highScore;

    let gameSpeed = 5;
    let frameCount = 0;

    const groundY = 160;

    const player = {
      x: 80,
      y: groundY,
      width: 20,
      height: 40,
      velocityY: 0,
      gravity: 0.7,
      jumpForce: -11,
      isGrounded: true,
      legAngle: 0
    };

    let obstacles = [];

    function resetGame() {
      score = 0;
      gameSpeed = 5;
      frameCount = 0;
      obstacles = [];
      player.y = groundY;
      player.velocityY = 0;
      player.isGrounded = true;
      isGameOver = false;
      isGameRunning = true;
      scoreElement.textContent = score;
    }

    function jump() {
      if (player.isGrounded && isGameRunning) {
        player.velocityY = player.jumpForce;
        player.isGrounded = false;
      }
    }

    function spawnObstacle() {
      const minGap = 90;
      const lastObstacle = obstacles[obstacles.length - 1];

      if (!lastObstacle || (canvas.width - lastObstacle.x) > (minGap + Math.random() * 150)) {
        const height = 25 + Math.random() * 20;
        obstacles.push({
          x: canvas.width,
          y: groundY - height,
          width: 20,
          height: height
        });
      }
    }

    function update() {
      if (!isGameRunning || isGameOver) return;

      frameCount++;
      if (frameCount % 6 === 0) {
        score++;
        scoreElement.textContent = score;
        if (score > highScore) {
          highScore = score;
          highscoreElement.textContent = highScore;
          localStorage.setItem('blackrun_highscore', highScore);
        }

        if (score % 100 === 0) {
          gameSpeed += 0.5;
        }
      }

      player.velocityY += player.gravity;
      player.y += player.velocityY;

      if (player.y >= groundY) {
        player.y = groundY;
        player.velocityY = 0;
        player.isGrounded = true;
      }

      if (player.isGrounded) {
        player.legAngle += 0.2;
      }

      if (Math.random() < 0.02) {
        spawnObstacle();
      }

      for (let i = 0; i < obstacles.length; i++) {
        let obs = obstacles[i];
        obs.x -= gameSpeed;

        const pLeft = player.x - 10;
        const pRight = player.x + 10;
        const pTop = player.y - player.height;
        const pBottom = player.y;

        const oLeft = obs.x;
        const oRight = obs.x + obs.width;
        const oTop = obs.y;
        const oBottom = obs.y + obs.height;

        if (pRight > oLeft && pLeft < oRight && pBottom > oTop && pTop < oBottom) {
          isGameOver = true;
          isGameRunning = false;
        }
      }

      obstacles = obstacles.filter(obs => obs.x + obs.width > 0);
    }

    function drawStickman(x, y, runningAngle, isJumping) {
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 2.5;
      ctx.lineCap = 'round';

      const headRadius = 7;
      const headY = y - 33;
      ctx.beginPath();
      ctx.arc(x, headY, headRadius, 0, Math.PI * 2);
      ctx.stroke();

      const neckY = headY + headRadius;
      const hipY = y - 12;
      ctx.beginPath();
      ctx.moveTo(x, neckY);
      ctx.lineTo(x, hipY);
      ctx.stroke();

      const shoulderY = neckY + 4;
      ctx.beginPath();
      if (isJumping) {
        ctx.moveTo(x, shoulderY);
        ctx.lineTo(x - 10, shoulderY - 8);
        ctx.moveTo(x, shoulderY);
        ctx.lineTo(x + 10, shoulderY - 8);
      } else {
        const armOffset = Math.sin(runningAngle) * 8;
        ctx.moveTo(x, shoulderY);
        ctx.lineTo(x - 8, shoulderY + armOffset);
        ctx.moveTo(x, shoulderY);
        ctx.lineTo(x + 8, shoulderY - armOffset);
      }
      ctx.stroke();

      ctx.beginPath();
      if (isJumping) {
        ctx.moveTo(x, hipY);
        ctx.lineTo(x - 8, y - 4);
        ctx.lineTo(x - 12, y);

        ctx.moveTo(x, hipY);
        ctx.lineTo(x + 6, y - 6);
        ctx.lineTo(x + 8, y);
      } else {
        const legOffset = Math.sin(runningAngle) * 10;
        ctx.moveTo(x, hipY);
        ctx.lineTo(x + legOffset, y);

        ctx.moveTo(x, hipY);
        ctx.lineTo(x - legOffset, y);
      }
      ctx.stroke();
    }

    function drawObstacle(obs) {
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 2.5;

      ctx.beginPath();
      ctx.moveTo(obs.x, obs.y + obs.height);
      ctx.lineTo(obs.x + 4, obs.y);
      ctx.lineTo(obs.x + obs.width - 4, obs.y);
      ctx.lineTo(obs.x + obs.width, obs.y + obs.height);
      ctx.closePath();
      ctx.stroke();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 3;

      ctx.beginPath();
      ctx.moveTo(0, groundY);
      ctx.lineTo(canvas.width, groundY);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(0, groundY + 12);
      ctx.lineTo(canvas.width, groundY + 12);
      ctx.stroke();

      if (isGameRunning || isGameOver) {
        drawStickman(player.x, player.y, player.legAngle, !player.isGrounded);

        for (let obs of obstacles) {
          drawObstacle(obs);
        }
      }

      if (!isGameRunning && !isGameOver) {
        drawStickman(player.x, player.y, 0, false);

        ctx.fillStyle = '#000000';
        ctx.font = 'bold 20px "Courier New"';
        ctx.textAlign = 'center';
        ctx.fillText('PRESSIONE ESPAÇO PARA INICIAR', canvas.width / 2, 80);
      } else if (isGameOver) {
        drawStickman(player.x, player.y, 0, true);

        for (let obs of obstacles) {
          drawObstacle(obs);
        }

        ctx.fillStyle = '#000000';
        ctx.font = 'bold 22px "Courier New"';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, 70);

        ctx.font = '14px "Courier New"';
        ctx.fillText('PRESSIONE ESPAÇO PARA TENTAR NOVAMENTE', canvas.width / 2, 95);
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        if (!isGameRunning) {
          resetGame();
        } else {
          jump();
        }
      }
    });

    canvas.addEventListener('click', () => {
      if (!isGameRunning) {
        resetGame();
      } else {
        jump();
      }
    });

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
