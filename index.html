<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlackRun - Experimental</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #f7f7f7;
            color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* Estilo para Modo Noite na página */
        body.tema-noite {
            background-color: #121212;
            color: #ffffff;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 5px;
            letter-spacing: 3px;
        }

        .badge {
            font-size: 10px;
            background: #000;
            color: #fff;
            padding: 2px 6px;
            vertical-align: middle;
        }

        body.tema-noite .badge {
            background: #fff;
            color: #000;
        }

        .scoreboard {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .painel-temas {
            margin-bottom: 15px;
        }

        .btn-tema {
            padding: 6px 14px;
            font-family: inherit;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            border: 2px solid #000;
            background: #fff;
            color: #000;
            margin: 0 4px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        body.tema-noite .btn-tema {
            border-color: #fff;
            background: #222;
            color: #fff;
        }

        .btn-tema:hover {
            opacity: 0.8;
        }

        canvas {
            border: 2px solid #000;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        body.tema-noite canvas {
            border-color: #ffffff;
        }

        .controls-hint {
            margin-top: 15px;
            font-size: 12px;
            text-align: center;
        }

        footer {
            position: absolute;
            bottom: 15px;
            right: 20px;
            font-size: 12px;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body class="tema-dia">

    <h1>BLACKRUN <span class="badge">EXPERIMENTAL</span></h1>
    <div class="scoreboard">
        PONTOS: <span id="score">0</span> &nbsp;&nbsp; RECORDES: <span id="highscore">0</span>
    </div>

    <!-- Painel de Seleção de Tema -->
    <div class="painel-temas">
        <button class="btn-tema" onclick="definirTema('dia')">☀️ Modo Dia</button>
        <button class="btn-tema" onclick="definirTema('noite')">🌙 Modo Noite</button>
    </div>

    <canvas id="gameCanvas" width="800" height="200"></canvas>

    <div class="controls-hint">
        Pressione <b>ESPAÇO</b> ou <b>CLIQUE NA TELA</b> para saltar.
    </div>

    <footer>
        Produção: Jefferson Gilvan Gomes dos Santos
    </footer>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highscoreEl = document.getElementById('highscore');

        // Configuração de Cores do Tema (Dia / Noite)
        let cores = {
            fundo: '#ffffff',
            desenho: '#000000'
        };

        function definirTema(modo) {
            if (modo === 'noite') {
                document.body.classList.add('tema-noite');
                document.body.classList.remove('tema-dia');
                cores.fundo = '#1a1a2e';  // Azul escuro noturno para o Canvas
                cores.desenho = '#ffffff'; // Linhas e boneco brancos
            } else {
                document.body.classList.add('tema-dia');
                document.body.classList.remove('tema-noite');
                cores.fundo = '#ffffff';  // Branco para o Canvas
                cores.desenho = '#000000'; // Linhas e boneco pretos
            }
        }

        // Estado do Jogo
        let gameRunning = false;
        let gameOver = false;
        let score = 0;
        let highscore = localStorage.getItem('blackrun_highscore') || 0;
        highscoreEl.innerText = highscore;

        let gameSpeed = 5;
        let frameCount = 0;

        // Player (Stickman)
        const player = {
            x: 80,
            y: 140,
            width: 20,
            height: 40,
            velocityY: 0,
            gravity: 0.6,
            jumpStrength: -11,
            isGrounded: true,
            legAngle: 0
        };

        // Obstáculos
        let obstacles = [];

        function spawnObstacle() {
            const height = Math.floor(Math.random() * 20) + 30;
            obstacles.push({
                x: canvas.width,
                y: 180 - height,
                width: 18,
                height: height
            });
        }

        function resetGame() {
            score = 0;
            gameSpeed = 5;
            obstacles = [];
            player.y = 140;
            player.velocityY = 0;
            player.isGrounded = true;
            gameOver = false;
            gameRunning = true;
            scoreEl.innerText = score;
        }

        function jump() {
            if (gameOver) {
                resetGame();
                return;
            }
            if (!gameRunning) {
                gameRunning = true;
            }
            if (player.isGrounded) {
                player.velocityY = player.jumpStrength;
                player.isGrounded = false;
            }
        }

        // Controlo por teclado e toque
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                jump();
            }
        });

        canvas.addEventListener('click', jump);

        // Loop Principal do Jogo
        function update() {
            frameCount++;

            // Limpa e pinta o fundo do Canvas com a cor do tema selecionado
            ctx.fillStyle = cores.fundo;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Desenha a linha do chão
            ctx.strokeStyle = cores.desenho;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, 180);
            ctx.lineTo(canvas.width, 180);
            ctx.stroke();

            if (gameRunning && !gameOver) {
                // Atualiza o jogador
                player.velocityY += player.gravity;
                player.y += player.velocityY;

                if (player.y >= 140) {
                    player.y = 140;
                    player.velocityY = 0;
                    player.isGrounded = true;
                }

                // Aumenta a pontuação
                if (frameCount % 6 === 0) {
                    score++;
                    scoreEl.innerText = score;
                    if (score > highscore) {
                        highscore = score;
                        highscoreEl.innerText = highscore;
                        localStorage.setItem('blackrun_highscore', highscore);
                    }
                    if (score % 100 === 0) {
                        gameSpeed += 0.5;
                    }
                }

                // Gestão de obstáculos
                if (frameCount % Math.max(60, Math.floor(120 - gameSpeed * 5)) === 0) {
                    if (Math.random() > 0.3) {
                        spawnObstacle();
                    }
                }

                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    obs.x -= gameSpeed;

                    // Desenha o obstáculo na cor do tema
                    ctx.strokeStyle = cores.desenho;
                    ctx.lineWidth = 2;
                    ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);

                    // Verificação de Colisão
                    if (
                        player.x < obs.x + obs.width &&
                        player.x + player.width > obs.x &&
                        player.y < obs.y + obs.height &&
                        player.y + player.height > obs.y
                    ) {
                        gameOver = true;
                    }

                    if (obs.x + obs.width < 0) {
                        obstacles.splice(i, 1);
                    }
                }
            }

            // Desenhar o Stickman (Jogador) na cor do tema
            ctx.strokeStyle = cores.desenho;
            ctx.fillStyle = cores.desenho;
            ctx.lineWidth = 2;

            const px = player.x + 10;
            const py = player.y;

            // Cabeça
            ctx.beginPath();
            ctx.arc(px, py + 6, 6, 0, Math.PI * 2);
            ctx.stroke();

            // Corpo
            ctx.beginPath();
            ctx.moveTo(px, py + 12);
            ctx.lineTo(px, py + 26);
            ctx.stroke();

            // Pernas (Animação de corrida)
            ctx.beginPath();
            if (!player.isGrounded) {
                // Posição de Salto
                ctx.moveTo(px, py + 26);
                ctx.lineTo(px - 8, py + 34);
                ctx.moveTo(px, py + 26);
                ctx.lineTo(px + 8, py + 38);
            } else {
                // Pernas a correr
                player.legAngle += 0.2;
                let legOffset = Math.sin(player.legAngle) * 8;
                ctx.moveTo(px, py + 26);
                ctx.lineTo(px + legOffset, py + 40);
                ctx.moveTo(px, py + 26);
                ctx.lineTo(px - legOffset, py + 40);
            }
            ctx.stroke();

            // Braços
            ctx.beginPath();
            ctx.moveTo(px, py + 16);
            ctx.lineTo(px - 6, py + 24);
            ctx.moveTo(px, py + 16);
            ctx.lineTo(px + 6, py + 22);
            ctx.stroke();

            // Mensagem de Game Over ou Início
            if (gameOver) {
                ctx.fillStyle = cores.desenho;
                ctx.font = 'bold 20px "Courier New"';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, 80);
                ctx.font = '12px "Courier New"';
                ctx.fillText('PRESSIONE ESPAÇO PARA TENTAR NOVAMENTE', canvas.width / 2, 110);
            } else if (!gameRunning) {
                ctx.fillStyle = cores.desenho;
                ctx.font = 'bold 16px "Courier New"';
                ctx.textAlign = 'center';
                ctx.fillText('CLIQUE OU PRESSIONE ESPAÇO PARA COMEÇAR', canvas.width / 2, 90);
            }

            requestAnimationFrame(update);
        }

        // Inicia o Loop
        update();
    </script>
</body>
</html>
